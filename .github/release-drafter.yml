name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

version-resolver:
  major:
    labels: ['breaking','major']
  minor:
    labels: ['feature','feat','enhancement']
  patch:
    labels: ['fix','bugfix','bug','patch','perf','refactor','chore','deps','dependencies']
  default: patch

categories:
  - title: '🚨 Breaking Changes'
    labels: ['breaking','major']
  - title: '✨ New Features'
    labels: ['feature','feat','enhancement']
  - title: '🐛 Bug Fixes'
    labels: ['fix','bugfix','bug']
  - title: '⚡ Performance Improvements'
    labels: ['perf','performance','optimization']
  - title: '🔧 Refactoring'
    labels: ['refactor','refactoring']
  - title: '📚 Documentation'
    labels: ['docs','documentation']
  - title: '🧪 Tests'
    labels: ['test','tests','testing']
  - title: '🔒 Security'
    labels: ['security','vulnerability']
  - title: '🏗️ Build / CI'
    labels: ['ci','build','devops','infrastructure']
  - title: '📦 Dependencies'
    labels: ['dependencies','deps']
  - title: '🧹 Chores'
    labels: ['chore','maintenance']

exclude-labels: ['skip-changelog','skip-release','wip','duplicate','invalid','wontfix']
exclude-contributors: ['dependabot','dependabot[bot]','github-actions','github-actions[bot]']

change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
no-changes-template: '- No changes in this release'
sort-direction: 'ascending'

replacers:
  - search: '/^(\w+)(?:\([^)]+\))?: (.+)$/gm'
    replace: '$2'
  - search: '/\s*\(#\d+\)$/g'
    replace: ''

autolabeler:
  - label: 'feat'
    title: ['/^feat/i']
  - label: 'fix'
    title: ['/^fix/i']
  - label: 'perf'
    title: ['/^perf/i']
  - label: 'docs'
    title: ['/^docs/i']
  - label: 'test'
    title: ['/^test/i']
  - label: 'ci'
    title: ['/^ci/i']
  - label: 'chore'
    title: ['/^chore/i']
  - label: 'breaking'
    title: ['/BREAKING CHANGE/i']
  - label: 'dependencies'
    files: ['package.json','pnpm-lock.yaml']
  - label: 'documentation'
    files: ['**/*.md','docs/**','website/**']
  - label: 'ci'
    files: ['.github/**']

template: |
  ## 🎉 Release v$RESOLVED_VERSION

  ### 📊 Summary
  **Released**: $PUBLISHED_AT
  **Compare**: [`$PREVIOUS_TAG...v$RESOLVED_VERSION`]($REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION)

  ### 📝 What's Changed
  $CHANGES

  ### 📦 Installation
  ```bash
  pnpm add magiclogger@^${RESOLVED_VERSION}
  # or
  npm install magiclogger@${RESOLVED_VERSION}
  ```

  ### 👥 Contributors
  $CONTRIBUTORS

  ---
  **Full Changelog**: $REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

  _Generated by [Release Drafter](https://github.com/release-drafter/release-drafter)_

name: Deploy Documentation to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'docs/**'
      - 'website/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json
      
      # Build the library first so the website can depend on local dist files
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
  # Use version from packageManager in root package.json

      - name: Install repo dependencies (no scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build library
        run: pnpm run build

      - name: Verify dist outputs
        run: |
          echo "Listing dist and dist/browser contents:";
          ls -la dist || true
          echo "--- dist/browser:";
          ls -la dist/browser || true

      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Install website dependencies (no scripts)
        run: npm ci --ignore-scripts
        working-directory: ./website
      
      - name: Build website
        run: npm run build
        working-directory: ./website
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

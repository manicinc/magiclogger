name: Docs build

# Builds the documentation site with scripts/build-docs-site.sh, the script ci.yml's deploy-docs
# job and deploy-docs.yml run after a push to master, and deploys nothing. Without it, a pull
# request that breaks the site (a Docusaurus or webpack release in pnpm-lock.yaml, a page in
# docs/, a change to the build commands) passes every check and the break first shows in the
# deploy on master. The setup steps and the gh-pages publish stay in each deploy workflow.
on:
  pull_request:
    branches: [master, main]
    paths:
      - 'docs/**'
      - 'website/**'
      # TypeDoc reads the source, README.md and tsconfig.json for the API pages, and checks
      # their links (typedoc.json validation.invalidLink).
      - 'src/**'
      - 'README.md'
      - 'tsconfig.json'
      # The library build that runs first, as in the deploy.
      - 'tsup.config.ts'
      - 'tsconfig.build.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'typedoc.json'
      - 'scripts/build-docs-site.sh'
      - '.github/workflows/docs-build.yml'

permissions:
  contents: read

concurrency:
  group: docs-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  docs-build:
    name: docs-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Build the site
        run: bash scripts/build-docs-site.sh

      # Both deploys build with the analytics ids set and the pages they publish carry the tags
      # website/src/plugins/analyticsPlugin.js injects; without this, a release that stops the
      # plugin's tags reaching the pages first shows on the live site, and shows nowhere in a run.
      - name: Check the analytics tags reached the pages
        run: |
          page=website/build/index.html
          for wanted in 'googletagmanager.com/gtag/js?id=G-DOCSBUILD' 'clarity.ms/tag/' 'docsbuild'; do
            if ! grep -Fq "$wanted" "$page"; then
              echo "::error::$page does not carry $wanted"
              exit 1
            fi
          done

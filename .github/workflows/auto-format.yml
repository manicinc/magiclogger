name: Auto Format

# By hand only: a push made with GITHUB_TOKEN starts no workflow, so a commit from this job leaves
# a head with no all-checks, which master's ruleset requires. Push once more after running it.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Prettier
        id: prettier
        run: |
          pnpm run format
          if [[ $(git status --porcelain) ]]; then
            echo "formatted=true" >> $GITHUB_OUTPUT
            echo "📝 Code formatting changes detected"
          else
            echo "formatted=false" >> $GITHUB_OUTPUT
            echo "✅ Code is already properly formatted"
          fi

      - name: Commit changes
        if: steps.prettier.outputs.formatted == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: auto-format code with prettier

          Co-authored-by: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          git push

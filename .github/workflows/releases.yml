name: Release

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types: [closed]
    branches:
      - main
      - master
  # Runs the release again by hand, for a release that failed after its commits landed: a
  # re-run reads the workflow of the failed commit, and a push releases only when its own
  # message starts with feat:, fix: or perf:. With dry_run, the dry-run job below runs
  # instead, on any branch.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: semantic-release --dry-run with no npm token (publishes, tags and pushes nothing)'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  packages: write

# A merged pull request starts two runs here, the push to master and the pull_request closed
# event (whose ref is master), and with cancel-in-progress one cancelled the other: after #49
# and #41 the closed runs 39502528638 and 17751756261 were cancelled. Were the push run
# cancelled instead, the release would not run: semantic-release publishes nothing from a
# pull_request event. A publishing workflow never cancels, and every run of this one waits in
# one fixed group, whatever its branch or event. queue: max keeps up to 100 runs waiting; with
# the default (queue: single) a newer run, even a push whose job is skipped, replaces the one
# waiting, so a waiting manual run would be dropped.
concurrency:
  group: semantic-release
  cancel-in-progress: false
  queue: max

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Skip for commits that don't need releases. A manual run releases master or main only, the
    # branches .releaserc names, and only without dry_run: on any other branch the coverage
    # steps below would push to it before semantic-release refused the branch.
    if: |
      (github.event_name == 'push' && 
       !contains(github.event.head_commit.message, '[skip ci]') && 
       !contains(github.event.head_commit.message, '[skip release]') &&
       !contains(github.event.head_commit.message, 'skip-release') &&
       !startsWith(github.event.head_commit.message, 'chore:') &&
       !startsWith(github.event.head_commit.message, 'docs:') &&
       !startsWith(github.event.head_commit.message, 'style:') &&
       !startsWith(github.event.head_commit.message, 'test:') &&
       !startsWith(github.event.head_commit.message, 'ci:') &&
       !startsWith(github.event.head_commit.message, 'build:') &&
       (startsWith(github.event.head_commit.message, 'feat:') ||
        startsWith(github.event.head_commit.message, 'fix:') ||
        startsWith(github.event.head_commit.message, 'perf:') ||
        contains(github.event.head_commit.message, 'BREAKING CHANGE'))) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       !contains(github.event.pull_request.labels.*.name, 'skip-release')) ||
      (github.event_name == 'workflow_dispatch' && !inputs.dry_run &&
       (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'))
    timeout-minutes: 45
    # Git hooks are for commits made by hand. pnpm install installs them here (prepare: husky),
    # and @semantic-release/git commits and pushes with hooks on: run 39541215457 stopped when
    # commit-msg's commitlint rejected the release notes' long lines, and pre-push would run
    # the typecheck and the whole suite again. husky 9 skips its install and every hook when
    # HUSKY is 0.
    env:
      HUSKY: '0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # npm's trusted publishing needs Node 22.14.0 or later (docs.npmjs.com/trusted-publishers).
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run linting
        run: pnpm run --if-present lint
        continue-on-error: false
      
      - name: Run tests with coverage
        timeout-minutes: 25
        env:
          CI: true
        run: pnpm run test:coverage
        continue-on-error: false
      
      - name: Build project
        run: pnpm run --if-present build

      - name: Check the packed package
        run: node scripts/check-packed-files.js

      - name: Check the release assets
        run: node scripts/check-release-assets.js
      
      - name: Generate coverage badge
        run: |
          if [ -f "package.json" ] && grep -q '"test:coverage:badge"' package.json; then
            pnpm run test:coverage:badge
          else
            echo "No coverage badge script found, skipping..."
          fi
      
      - name: Commit coverage badge updates
        run: |
          if [ -n "$(git status --porcelain README.md docs/test-coverage.md docs/test_coverage.md 2>/dev/null)" ]; then
            git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add README.md docs/test-coverage.md docs/test_coverage.md 2>/dev/null || true
            git diff --staged --quiet || (git commit -m "docs: update coverage badge [skip ci]" && echo "BADGE_UPDATED=true" >> $GITHUB_ENV)
          else
            echo "No coverage badge changes to commit"
          fi
      
      - name: Push coverage badge updates
        if: env.BADGE_UPDATED == 'true'
        # The branch reaches the shell as the runner's GITHUB_REF variable, quoted, rather than
        # pasted into the script, so a branch name cannot add a command.
        run: |
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "HEAD:${GITHUB_REF}"
      
      # Trusted publishing needs npm 11.5.1 or later. Node 22 ships npm 10, which can only publish with the token
      # and ends in ENEEDAUTH when a plugin skips the token after the exchange (framerslab/agentos run 39490192582).
      - name: Use npm 11 for trusted publishing
        run: npm install -g npm@11.20.0 && npm --version

      - name: Semantic Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # The steps above ran the lint, the suite, the build and the packed-files check on this
          # commit. semantic-release pushes the release commit and the tag before its publish step
          # (semantic-release 21.1.2 index.js lines 205 to 212), and npm publish would then run
          # prepublishOnly: the suite again with parallel workers (CI runs it only with
          # --runInBand), the lint, the build and the badge and size scripts. A red second run
          # there leaves the tag with nothing on npm. npm reads this for the version and publish
          # commands @semantic-release/npm runs, so it also skips the version script's format.
          npm_config_ignore_scripts: 'true'
        run: |
          npx semantic-release --ci
      
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage/
            .nyc_output/
          retention-days: 30
          if-no-files-found: ignore
      
      - name: Comment on PR with release info
        if: steps.semantic.outputs.new-release-published == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: { sha } } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha
            });
            
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: sha
            });
            
            if (prs.length > 0) {
              const version = '${{ steps.semantic.outputs.new-release-version }}';
              const releaseNotes = `🎉 This PR was included in version ${version}`;
              
              for (const pr of prs) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body: releaseNotes
                });
              }
            }

  # A manual run with dry_run checks a release without making one, on any branch. No npm token
  # is in reach (NPM_TOKEN is not passed and NODE_AUTH_TOKEN is empty), so @semantic-release/npm
  # passes verifyConditions only through the OIDC exchange with the trusted publisher for this
  # file. semantic-release --dry-run runs verifyConditions, the commit analysis and the notes,
  # and skips prepare, publish, the tag and every push. --branches names the dispatched branch:
  # on a branch .releaserc does not name, semantic-release stops before verifyConditions. The
  # suite, the build and the coverage badge steps stay in the release job.
  #
  # Who can publish: npm's trusted publisher for this package names this file and no
  # environment, so a run of it from any branch of this repository can make the exchange, and
  # anyone with write access can start one (a manual run needs write access, and a pushed
  # branch can change this file first). This job adds no one: npm says as much when the
  # trusted publisher is created ("Anyone with GitHub repository write access can publish").
  # A GitHub environment that admits master only, named on the trusted publisher and in the
  # release job, would narrow it.
  dry-run:
    name: Release dry run
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # semantic-release asks the remote whether it may push (git push --dry-run) first.
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Semantic Release (dry run, no npm token)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # setup-node's .npmrc reads its token from NODE_AUTH_TOKEN.
          NODE_AUTH_TOKEN: ''
        run: |
          if [ -n "${NPM_TOKEN:-}" ] || [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::An npm token is in this step's environment."
            exit 1
          fi
          echo "NPM_TOKEN is not set and NODE_AUTH_TOKEN is empty."
          npx semantic-release --dry-run --branches "$GITHUB_REF_NAME"

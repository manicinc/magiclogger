name: Deploy Docs

on:
  push:
    branches:
      - master
      - main
    # The paths docs-build.yml checks on a pull request: the site's pages and the API pages it
    # generates from the source. This is the one workflow that publishes to gh-pages.
    paths:
      - 'docs/**'
      - 'website/**'
      - 'src/**'
      - 'README.md'
      - 'tsconfig.json'
      - 'tsup.config.ts'
      - 'tsconfig.build.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'typedoc.json'
      - 'scripts/build-docs-site.sh'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# One group, because every run publishes to the same gh-pages branch. The running deploy finishes
# and only the newest waiting run is kept.
concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  deploy:
    # A manual run from another branch would replace the live site with that branch's pages.
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      # The install, the library build, the API pages and the Docusaurus build, as docs-build.yml
      # runs them on pull requests. No website/node_modules cache is restored first: setup-node's
      # pnpm cache holds the store.
      - name: Build the site
        run: bash scripts/build-docs-site.sh
        env:
          GA_TRACKING_ID: ${{ secrets.GA_TRACKING_ID }}
          MS_CLARITY_ID: ${{ secrets.MS_CLARITY_ID }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website/build
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy docs from ${{ github.sha }}'
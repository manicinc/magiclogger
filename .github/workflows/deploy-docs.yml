name: Deploy Docs

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'docs/**'
      - 'website/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      # The install, the library build, the API pages and the Docusaurus build, as docs-build.yml
      # runs them on pull requests and ci.yml's deploy-docs job runs them before its own publish.
      - name: Build the site
        run: bash scripts/build-docs-site.sh
        env:
          GA_TRACKING_ID: ${{ secrets.GA_TRACKING_ID }}
          MS_CLARITY_ID: ${{ secrets.MS_CLARITY_ID }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website/build
          publish_branch: gh-pages
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy documentation website'
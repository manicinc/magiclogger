name: Auto Label PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to label (optional)'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  label:
    name: Auto-label PR
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true || github.event.action == 'ready_for_review'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply labels based on file paths
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true

      - name: Label based on PR title
        uses: bcoe/conventional-release-labels@v1
        if: github.event_name == 'pull_request_target'
        with:
          type_labels: |
            {
              "feat": "feature",
              "fix": "bug",
              "docs": "documentation",
              "style": "style",
              "refactor": "refactor",
              "perf": "performance",
              "test": "test",
              "build": "build",
              "ci": "ci",
              "chore": "chore",
              "revert": "revert",
              "breaking": "breaking"
            }
          ignored_types: '[]'

      - name: Add size labels
        uses: codelytv/pr-size-labeler@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_label: 'size: XS'
          xs_max_size: 10
          s_label: 'size: S'
          s_max_size: 50
          m_label: 'size: M'
          m_max_size: 200
          l_label: 'size: L'
          l_max_size: 500
          xl_label: 'size: XL'
          fail_if_xl: false
          message_if_xl: 'Large PR (500+ lines). Consider splitting.'
          files_to_ignore: |
            '*.lock'
            'pnpm-lock.yaml'
            'package-lock.json'
            'yarn.lock'
            'CHANGELOG.md'

      - name: Comment label summary
        if: github.event.action == 'opened'
        uses: actions/github-script@v7
        with:
          script: |
            const labels = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            if (labels.data.length) {
              const names = labels.data.map(l => `\`${l.name}\``).join(', ');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `🏷️ **Auto-labeling complete**\n\nApplied: ${names}`
              });
            }
        continue-on-error: true

      - name: Manual labeling
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Labeling PR #${{ github.event.inputs.pr_number }}"

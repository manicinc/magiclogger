name: CI

on:
  push:
    branches: [master, main, dev]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  NODE_VERSION: '18'
  CACHE_VERSION: v1

jobs:
  pre-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commitlint (conventional commits)
        if: github.event_name == 'pull_request'
        uses: wagoid/commitlint-github-action@v5
        continue-on-error: true
      - name: Large file check (10MB warn)
        uses: ActionsDesk/lfs-warning@v2.0
        with:
          filesizelimit: 10485760

  quality:
    runs-on: ubuntu-latest
    needs: pre-check
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Enable corepack
        run: corepack enable
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Type check
        run: pnpm exec tsc -p tsconfig.json --noEmit
      - name: Format check
        run: pnpm run format:check
      - name: Audit (non-blocking)
        run: pnpm audit || true

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['16','18','20']
        exclude:
          - os: macos-latest
            node: '16'
          - os: macos-latest
            node: '18'
    runs-on: ${{ matrix.os }}
    needs: pre-check
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
      - name: Enable corepack
        run: corepack enable
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Run tests with coverage
        run: pnpm run test:coverage -- --runInBand
      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest' && matrix.node == '18'
        uses: actions/upload-artifact@v4
        with:
            name: coverage-${{ github.sha }}
            path: coverage
      - name: Upload to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.node == '18'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false
          verbose: true

  security:
    runs-on: ubuntu-latest
    needs: pre-check
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dependency Review (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Enable corepack
        run: corepack enable
      - name: Install deps (production only for audit)
        run: pnpm install --frozen-lockfile --prod=false
      - name: Run pnpm audit (non-blocking)
        run: pnpm audit || true
      - name: Run gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: false
        with:
          config: ''
          args: detect --no-git -v
      - name: TruffleHog secret scan (diff)
        uses: trufflesecurity/trufflehog@v3
        continue-on-error: false
        with:
          extra_args: --only-verified commits HEAD~50..HEAD
      - name: Upload SARIF (if any) placeholder
        if: always()
        run: echo "Security scanning complete"

  build:
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Enable corepack
        run: corepack enable
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Bundle size analyze
        run: node scripts/analyze-build.js || true
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist

  release-draft:
    name: Update Release Draft
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - uses: release-drafter/release-drafter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  all-checks:
    runs-on: ubuntu-latest
    needs: [quality, test, build, security]
    if: always()
    steps:
      - name: Final status
        run: echo "✅ Core CI jobs completed"
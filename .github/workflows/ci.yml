name: CI

on:
  push:
    branches: [master, main, dev]
  pull_request:
    branches: [master, main]
  # schedule:
  #   - cron: '0 3 * * *'  # Commented to save Actions minutes
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '18'

jobs:
  pre-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commitlint (conventional commits)
        if: github.event_name == 'pull_request'
        uses: wagoid/commitlint-github-action@v5
        continue-on-error: true
      - name: Large file check (10MB warn)
        uses: ActionsDesk/lfs-warning@v2.0
        with:
          filesizelimit: 10485760

  quality:
    runs-on: ubuntu-latest
    needs: pre-check
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Uses packageManager from package.json
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      
      - name: Install deps
        run: pnpm install --frozen-lockfile
      
      - name: Lint
        run: pnpm run lint
      
      - name: Type check
        run: pnpm run typecheck
      
      - name: Format check
        run: pnpm run format:check
      
      - name: Audit (non-blocking)
        run: pnpm audit || true

  test-linux:
    runs-on: ubuntu-latest
    needs: pre-check
    # UNCOMMENT FOR MATRIX TESTING:
    # strategy:
    #   fail-fast: false
    #   matrix:
    #     node: ['18', '20']
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # UNCOMMENT FOR MATRIX: node-version: ${{ matrix.node }}
          cache: 'pnpm'
      
      - name: Install deps
        run: pnpm install --frozen-lockfile
      
      - name: Auto-format and commit if needed
        run: |
          pnpm run format
          if [[ $(git status --porcelain) ]]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "chore: auto-format code via CI"
            git push
          fi
      - name: Run tests with coverage
        run: pnpm run test:coverage
      
      - name: Upload coverage artifact
        # if: matrix.node == '18'  # UNCOMMENT FOR MATRIX
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage
      
      - name: Upload to Codecov
        # if: matrix.node == '18'  # UNCOMMENT FOR MATRIX
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false
          verbose: true
          slug: manicinc/magiclogger
  # Token is NOT required for public repos when running in GitHub Actions.
  # Uncomment the env block below only if you prefer token auth (e.g., private repos
  # or if you want to use an org-level token). Add CODECOV_TOKEN as a GitHub secret.
  # env:
  #   CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # UNCOMMENT THIS ENTIRE JOB FOR CROSS-PLATFORM TESTING:
  # test-cross:
  #   name: test (windows/macOS)
  #   if: github.event_name == 'pull_request' || github.event_name == 'schedule'
  #   needs: pre-check
  #   strategy:
  #     fail-fast: false
  #     matrix:
  #       os: [windows-latest, macos-latest]
  #       node: ['20']
  #   runs-on: ${{ matrix.os }}
  #   steps:
  #     - uses: actions/checkout@v4
  #     
  #     - name: Setup pnpm
  #       uses: pnpm/action-setup@v4
  #     
  #     - name: Setup Node.js
  #       uses: actions/setup-node@v4
  #       with:
  #         node-version: ${{ matrix.node }}
  #         cache: 'pnpm'
  #     
  #     - name: Install deps
  #       run: pnpm install --frozen-lockfile
  #     
  #     - name: Run tests with coverage
  #       run: pnpm run test:coverage

  security:
    runs-on: ubuntu-latest
    needs: pre-check
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Dependency Review (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      
      - name: Install deps (production only for audit)
        run: pnpm install --frozen-lockfile --prod=false
      
      - name: Run pnpm audit (non-blocking)
        run: pnpm audit || true
      
      - name: Trivy secret scan (repo)
        uses: aquasecurity/trivy-action@0.20.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'secret'
          format: 'table'
          exit-code: '1'
          hide-progress: true

  build:
    runs-on: ubuntu-latest
    needs: [quality, test-linux]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      
      - name: Install deps
        run: pnpm install --frozen-lockfile
      
      - name: Build
        run: pnpm run build
      
      - name: Bundle size check
        run: pnpm run size:check
      
      - name: Update bundle size (README)
        run: pnpm run size:update
      
      - name: Commit README size update (PR only)
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet --exit-code README.md; then
            echo "No README size changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(ci): update bundle size table [skip ci]" || true
          git push || echo "Non-fatal: push failed (likely due to permissions)"
      
      - name: Bundle size analyze
        run: node scripts/analyze-build.js || true
      
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist

  release-draft:
    name: Update Release Draft
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - uses: release-drafter/release-drafter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  all-checks:
    runs-on: ubuntu-latest
    needs: [quality, test-linux, build, security]
    # needs: [quality, test-linux, test-cross, build, security]  # UNCOMMENT FOR CROSS-PLATFORM
    if: always()
    steps:
      - name: Final status
        run: echo "✅ Core CI jobs completed"
<!-- Transport Icon -->
<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="transport-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9945ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ff88;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Server/Console -->
  <rect x="4" y="10" width="16" height="12" rx="2" fill="url(#transport-gradient)" opacity="0.8"/>
  <rect x="6" y="12" width="12" height="2" fill="white" opacity="0.6"/>
  <rect x="6" y="15" width="8" height="1" fill="white" opacity="0.4"/>
  <rect x="6" y="17" width="10" height="1" fill="white" opacity="0.4"/>
  
  <!-- File -->
  <rect x="28" y="8" width="12" height="16" rx="2" fill="url(#transport-gradient)" opacity="0.6"/>
  <rect x="30" y="12" width="8" height="1" fill="white" opacity="0.5"/>
  <rect x="30" y="15" width="6" height="1" fill="white" opacity="0.4"/>
  <rect x="30" y="18" width="7" height="1" fill="white" opacity="0.4"/>
  
  <!-- Cloud -->
  <ellipse cx="24" cy="32" rx="8" ry="5" fill="url(#transport-gradient)" opacity="0.7"/>
  <ellipse cx="20" cy="30" rx="5" ry="3" fill="url(#transport-gradient)" opacity="0.5"/>
  <ellipse cx="28" cy="30" rx="5" ry="3" fill="url(#transport-gradient)" opacity="0.5"/>
  
  <!-- Connection lines with animation -->
  <path d="M20 16 L28 16" stroke="url(#transport-gradient)" stroke-width="2" opacity="0.6">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2s" repeatCount="indefinite"/>
  </path>
  <path d="M20 20 L24 28" stroke="url(#transport-gradient)" stroke-width="2" opacity="0.6">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.5s" repeatCount="indefinite"/>
  </path>
  <path d="M32 20 L28 28" stroke="url(#transport-gradient)" stroke-width="2" opacity="0.6">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="1.8s" repeatCount="indefinite"/>
  </path>
</svg>

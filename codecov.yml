codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default:
        target: auto
        threshold: 5%  # allow 5% drop
        base: auto
        if_ci_failed: error
        if_not_found: success
        informational: false
    patch:
      default:
        target: 70%  # require 70% coverage on new code
        threshold: 10%  # allow 10% variance
        base: auto
        if_ci_failed: error
        if_not_found: success
        informational: false

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

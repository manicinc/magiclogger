codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default:
        target: auto
        threshold: 0%  # fail on any drop
        base: auto
    patch:
      default:
        target: auto
        threshold: 0%  # fail on any drop for changed lines

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false

<?xml version="1.0" encoding="UTF-8"?>
<svg width="280" height="80" viewBox="0 0 280 80" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="magicGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#9945ff;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#00d4ff;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#00ff88;stop-opacity:1" />
        </linearGradient>
        
        <linearGradient id="magicTextGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#1a202c;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#718096;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#a0aec0;stop-opacity:1" />
        </linearGradient>
        
        <linearGradient id="magicTextGradientDark" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#e9ecef;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#adb5bd;stop-opacity:1" />
        </linearGradient>
        
        <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#00ff88;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:1" />
        </linearGradient>
        
        <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#0080ff;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:1" />
        </linearGradient>
        
        <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#9945ff;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#ff0080;stop-opacity:1" />
        </linearGradient>
    </defs>
    
    <g id="icon">
        <rect x="10" y="15" width="50" height="50" rx="8" fill="none" stroke="url(#magicGradient)" stroke-width="2.5"/>
        <rect x="10" y="15" width="50" height="12" rx="8" fill="url(#magicGradient)" opacity="0.2"/>
        <path d="M 10 23 L 60 23" stroke="url(#magicGradient)" stroke-width="2.5"/>
        
        <rect x="18" y="32" width="20" height="3" rx="1.5" fill="url(#greenGradient)"/>
        <rect x="18" y="39" width="28" height="3" rx="1.5" fill="url(#blueGradient)"/>
        <rect x="18" y="46" width="16" height="3" rx="1.5" fill="url(#purpleGradient)"/>
        <rect x="37" y="46" width="10" height="3" rx="1.5" fill="#ffcc00"/>
        <rect x="18" y="53" width="24" height="3" rx="1.5" fill="url(#greenGradient)"/>
        
        <g id="sparkles">
            <path d="M 52 25 L 54 27 L 56 25 L 54 23 Z" fill="#9945ff" opacity="0.8"/>
            <circle cx="48" cy="56" r="1.5" fill="#00d4ff" opacity="0.7"/>
            <circle cx="56" cy="35" r="1" fill="#00ff88" opacity="0.8"/>
            <path d="M 15 58 L 16 59 L 15 60 L 14 59 Z" fill="#ff0080" opacity="0.6"/>
        </g>
    </g>
    
    <g id="wordmark">
        <text x="75" y="48" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="26" font-weight="600">
            <tspan fill="url(#magicTextGradient)">Magic</tspan><tspan fill="url(#magicGradient)">Log</tspan>
        </text>
        
    </g>
</svg>
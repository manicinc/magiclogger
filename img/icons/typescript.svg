<!-- TypeScript/Type Safety Icon -->
<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="typescript-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9945ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ff88;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Shield base -->
  <path d="M24 4 L8 12 L8 24 C8 32 16 40 24 44 C32 40 40 32 40 24 L40 12 L24 4 Z" fill="url(#typescript-gradient)" opacity="0.8"/>
  
  <!-- TypeScript TS -->
  <text x="24" y="28" font-family="Inter, sans-serif" font-weight="700" font-size="16" text-anchor="middle" fill="white">TS</text>
  
  <!-- Checkmark -->
  <path d="M16 24 L22 30 L32 18" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="stroke-dasharray" values="0,20; 20,0" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="stroke-dashoffset" values="20; 0" dur="2s" repeatCount="indefinite"/>
  </path>
</svg>

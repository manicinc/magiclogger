<!-- Tree Shaking Icon -->
<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tree-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9945ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ff88;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Tree trunk -->
  <rect x="22" y="28" width="4" height="16" fill="url(#tree-gradient)"/>
  <!-- Tree leaves -->
  <circle cx="24" cy="16" r="12" fill="url(#tree-gradient)" opacity="0.8"/>
  <circle cx="20" cy="12" r="8" fill="url(#tree-gradient)" opacity="0.6"/>
  <circle cx="28" cy="12" r="8" fill="url(#tree-gradient)" opacity="0.6"/>
  <!-- Falling leaves animation -->
  <circle cx="16" cy="20" r="2" fill="url(#tree-gradient)" opacity="0.4">
    <animateTransform attributeName="transform" type="translate" values="0,0; 2,8; 0,16" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="32" cy="18" r="2" fill="url(#tree-gradient)" opacity="0.4">
    <animateTransform attributeName="transform" type="translate" values="0,0; -2,6; 0,12" dur="2.5s" repeatCount="indefinite"/>
  </circle>
</svg>

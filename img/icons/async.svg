<!-- Async/Batching Icon -->
<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="async-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9945ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ff88;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Clock circle -->
  <circle cx="24" cy="24" r="18" fill="url(#async-gradient)" opacity="0.8"/>
  <circle cx="24" cy="24" r="14" fill="white" opacity="0.9"/>
  
  <!-- Clock hands -->
  <line x1="24" y1="24" x2="24" y2="14" stroke="url(#async-gradient)" stroke-width="3" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" values="0 24 24; 360 24 24" dur="4s" repeatCount="indefinite"/>
  </line>
  <line x1="24" y1="24" x2="30" y2="24" stroke="url(#async-gradient)" stroke-width="2" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" values="0 24 24; 360 24 24" dur="12s" repeatCount="indefinite"/>
  </line>
  
  <!-- Batch indicators -->
  <rect x="8" y="8" width="4" height="4" rx="1" fill="url(#async-gradient)" opacity="0.6">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" repeatCount="indefinite"/>
  </rect>
  <rect x="36" y="8" width="4" height="4" rx="1" fill="url(#async-gradient)" opacity="0.6">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" begin="0.3s" repeatCount="indefinite"/>
  </rect>
  <rect x="8" y="36" width="4" height="4" rx="1" fill="url(#async-gradient)" opacity="0.6">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" begin="0.6s" repeatCount="indefinite"/>
  </rect>
  <rect x="36" y="36" width="4" height="4" rx="1" fill="url(#async-gradient)" opacity="0.6">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" begin="0.9s" repeatCount="indefinite"/>
  </rect>
</svg>

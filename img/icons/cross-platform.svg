<!-- Cross-platform Icon -->
<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="platform-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9945ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ff88;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Desktop -->
  <rect x="4" y="12" width="18" height="12" rx="2" fill="url(#platform-gradient)" opacity="0.8"/>
  <rect x="10" y="24" width="6" height="2" fill="url(#platform-gradient)" opacity="0.6"/>
  <rect x="8" y="26" width="10" height="1" fill="url(#platform-gradient)" opacity="0.6"/>
  
  <!-- Mobile -->
  <rect x="26" y="8" width="8" height="14" rx="2" fill="url(#platform-gradient)" opacity="0.7"/>
  <circle cx="30" cy="20" r="1" fill="white" opacity="0.8"/>
  
  <!-- Cloud/Browser -->
  <ellipse cx="38" cy="30" rx="6" ry="4" fill="url(#platform-gradient)" opacity="0.6"/>
  <ellipse cx="35" cy="28" rx="3" ry="2" fill="url(#platform-gradient)" opacity="0.5"/>
  <ellipse cx="41" cy="28" rx="3" ry="2" fill="url(#platform-gradient)" opacity="0.5"/>
  
  <!-- Connection lines -->
  <path d="M13 18 Q24 6 30 12" stroke="url(#platform-gradient)" stroke-width="2" fill="none" opacity="0.6">
    <animate attributeName="stroke-dasharray" values="0,20; 20,0" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M30 20 Q34 24 35 30" stroke="url(#platform-gradient)" stroke-width="2" fill="none" opacity="0.6">
    <animate attributeName="stroke-dasharray" values="0,15; 15,0" dur="2.5s" begin="0.5s" repeatCount="indefinite"/>
  </path>
  
  <!-- Center node -->
  <circle cx="24" cy="24" r="3" fill="url(#platform-gradient)">
    <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
